# Root Directory = backend | Domain target port = 8080
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "echo PORT=$PORT; alembic upgrade head || echo WARN_alembic_failed; exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
